# Reference workflow for the Clean Architecture module (clean_architecture/).
#
# GitHub Apps cannot push files under .github/workflows/ without the dedicated
# "workflows" permission, so this file is kept here as a reference. To activate
# it, copy it to .github/workflows/clean-architecture-tests.yml at the
# repository root (see clean_architecture/ci/CI_SETUP.md).
#
# Actions are pinned to v6, which runs on Node.js 24 (v4/v5 target the
# deprecated Node.js 20 runtime).
name: Clean Architecture - Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'clean_architecture/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'clean_architecture/**'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: clean_architecture

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: pytest -v

    - name: Coverage report
      run: pytest --cov=. --cov-report=term-missing
